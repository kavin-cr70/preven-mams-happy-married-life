<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athi & Mams – Happy Married Life</title>
<style>
:root{--rose:#f7c6d0;--deep:#8e2d52;--gold:#f5d27a;--cream:#fff8f1;--ink:#3b2430}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;background:#2b1020}
.s{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vh 8vw 10vh;overflow:hidden}
.s.on{display:flex}
.s.a{background:linear-gradient(135deg,#ffd6e0,#fff1e6);color:var(--ink)}
.s.b{background:linear-gradient(135deg,#8e2d52,#c2587a);color:#fff}
.s.c{background:linear-gradient(135deg,#fff8f1,#f9e3c9);color:var(--ink)}
.s.d{background:linear-gradient(135deg,#2b1020,#6b2445);color:#fff}
.kick{font-family:Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;font-size:max(12px,1.4vw);color:var(--deep);margin-bottom:2vh}
.s.b .kick,.s.d .kick{color:var(--gold)}
h1{font-size:max(48px,9vw);line-height:1.05;color:var(--deep)}
h2{font-size:max(32px,5.2vw);line-height:1.2;color:var(--deep);margin-bottom:3vh}
.s.b h2,.s.d h2{color:#fff}
p{font-size:max(18px,2.6vw);line-height:1.5;max-width:900px}
.amp{color:var(--gold);font-style:italic}
.big{font-size:max(60px,14vw);line-height:1;margin:2vh 0}
ul{list-style:none;display:grid;gap:2vh;max-width:1000px}
li{font-size:max(17px,2.4vw);line-height:1.4}
li:before{content:"♥ ";color:var(--deep)}
.s.b li:before,.s.d li:before{color:var(--gold)}
.heart{position:absolute;bottom:-10vh;font-size:3vw;opacity:.7;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-120vh);opacity:0}}
.s.on>*{animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
#bar{position:fixed;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--gold),#ff8fab);z-index:9;transition:width .4s}
#nav{position:fixed;right:2vw;bottom:2vh;z-index:9;display:flex;gap:8px;align-items:center;color:#f3d6df;font-family:Arial,sans-serif;font-size:14px}
#nav button{border:0;background:var(--deep);color:#fff;border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"></div>
<div id="nav"><span id="n"></span><button onclick="go(-1)" aria-label="Previous">‹</button><button onclick="go(1)" aria-label="Next">›</button><button onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()" aria-label="Fullscreen">⛶</button></div>
<script>
const S=[
{t:'title', k:'With love', h:'Athi <span class="amp">&</span> Mams', p:'Celebrating a happy married life together'},
{t:'a', k:'Chapter 1', h:'Two Hearts, One Home', p:'Every love story is beautiful, but ours is our favourite.'},
{t:'big', k:'Always', big:'♥', h:'Together is our favourite place to be', p:'Through every season, you two have chosen each other.'},
{t:'c', k:'Happy Moments', h:'Little Things We Love', l:['Morning coffee shared in quiet smiles','Laughter that fills every room','Holding hands on long walks','Cooking dinner together and teasing about the recipe','Lazy Sunday afternoons with no plans at all']},
{t:'b', k:'Partnership', h:'A Team in Everything', p:'You face life side by side, cheering each other on and lifting each other up.'},
{t:'c', k:'Growing Together', h:'What Makes Your Marriage Strong', l:['Respect for each other’s dreams','Kindness, even on tired days','Patience and honest conversations','Forgiving quickly and loving deeply','Choosing each other again every day']},
{t:'a', k:'Laughter', h:'The Best Medicine', p:'Your laughter fills the house and makes every hard day a little lighter.'},
{t:'d', k:'Adventures', h:'Making Memories', l:['Trips and road adventures','Celebrations big and small','Quiet nights in front of a favourite movie','Surprises that made the other smile']},
{t:'big', k:'Support', big:'🤝', h:'Always There For Each Other', p:'In good times and in hard times, you have been each other’s safe place.'},
{t:'c', k:'Romance', h:'Sweet Little Gestures', l:['Love notes tucked into bags','Surprise flowers for no reason','A kiss goodbye every morning','Dancing in the kitchen to old songs']},
{t:'b', k:'Gratitude', h:'Thankful Hearts', p:'Thank you for showing everyone what a loving, lasting marriage looks like.'},
{t:'a', k:'Future', h:'Many More Years Ahead', p:'May your love keep growing, your home stay warm, and your days be full of joy.'},
{t:'c', k:'Blessings', h:'Wishes for Your Married Life', l:['Health and happiness for both of you','Peace in your home and steady hearts','Dreams that keep coming true','Love that grows stronger every year']},
{t:'big', k:'Forever', big:'💍', h:'Happily Ever After', p:'Here’s to the couple who make love look easy.'},
{t:'d', k:'Anniversary', h:'Cheers to You Both', l:['Your love story inspires us all','May every year be sweeter than the last','Thank you for the joy you bring to our family']},
{t:'a', k:'Thank You', h:'With All Our Love', p:'Happy married life, Athi and Mams. We love you both!'},
{t:'end', k:'The End', h:'Here’s to Forever', p:'♥ ♥ ♥'}
];

const app=document.getElementById('app');let cur=0;
const hearts=['♥','❤','💕','♡'];
S.forEach((s,i)=>{
  const d=document.createElement('section');
  const cls={title:'a',a:'a',b:'b',c:'c',d:'d',big:'a',end:'b'}[s.t];
  d.className='s '+cls;
  let inner='';
  if(s.k) inner+=`<div class="kick">${s.k}</div>`;
  if(s.t==='title') inner+=`<h1>${s.h}</h1><p>${s.p}</p>`;
  else if(s.t==='big') inner+=`<div class="big">${s.big}</div><h2>${s.h}</h2><p>${s.p}</p>`;
  else if(s.t==='c'||s.t==='d') inner+=`<h2>${s.h}</h2><ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='end') inner+=`<h1>${s.h}</h1><p>${s.p}</p>`;
  else inner+=`<h2>${s.h}</h2><p>${s.p}</p>`;
  d.innerHTML=inner;
  if(s.t==='title'||s.t==='end'){
    for(let h=0;h<14;h++){
      const e=document.createElement('span');e.className='heart';
      e.textContent=hearts[h%hearts.length];
      e.style.left=Math.random()*100+'%';
      e.style.animationDuration=(6+Math.random()*6)+'s';
      e.style.animationDelay=(-Math.random()*8)+'s';
      e.style.color=s.t==='title'?'#f7c6d0':'#f5d27a';
      d.appendChild(e);
    }
  }
  app.appendChild(d);
});
const E=[...app.children];

function show(i){
  cur=Math.max(0,Math.min(E.length-1,i));
  E.forEach((e,k)=>e.classList.toggle('on',k===cur));
  E[cur].querySelectorAll('li').forEach((l,k)=>l.style.animationDelay=(.3+k*.15)+'s');
  document.getElementById('bar').style.width=((cur+1)/E.length*100)+'%';
  document.getElementById('n').textContent=(cur+1)+' / '+E.length;
}
function go(d){show(cur+d)}
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))go(1);
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))go(-1);
  if(e.key==='Home')show(0);
  if(e.key==='End')show(E.length-1);
  if(e.key==='f')document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1)});
show(0);
</script>
</body>
</html>
